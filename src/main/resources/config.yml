# MezarSistemi ayarları
# Mesaj dili: tr veya en
dil: tr

# Mezarı kaç saniye boyunca SADECE sahibi açabilir.
# Süre bitince herkes açabilir. -1 yaparsan hep sadece sahibi açabilir.
koruma-suresi: 300

# Ölünce XP de mezara girsin mi? (levelin tamamı geri gelir)
xp-sakla: true

# Mezar oluşunca zararsız şimşek efekti
simsek: true

# Mezar görünümü:
#   gercekci = topraktan yükselen mezar taşı, toprak yığını, çiçekler, mumlar ve saplanmış silah
#   kafa     = eski görünüm (aşağıdaki mezar-blogu)
gorunum: gercekci

# Gerçekçi mezar taşının bloğu (ör. polished_andesite, stone, polished_deepslate, tuff)
tas-blogu: polished_andesite

# Ölen oyuncunun en iyi kılıcı/baltası mezar toprağına saplanmış görünsün mü (sadece görüntü, eşya mezarda)
silah-goster: true

# "kafa" görünümünde mezar olarak konacak blok (PLAYER_HEAD = oyuncunun kafası)
mezar-blogu: PLAYER_HEAD

# Mezar havada kalırsa altına konacak blok
platform-blogu: COBBLESTONE

# Bu dünyalarda mezar oluşmaz (eşyalar normal düşer)
haric-dunyalar: []

